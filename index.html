/* Watermark */

.watermark-container{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.watermark-text{
    position:absolute;
    width:300%;
    height:300%;
    top:-50%;
    left:-50%;
    font-size:85px;
    font-weight:900;
    color:rgba(255,255,255,0.13);
    transform:rotate(-25deg);
    white-space:pre;
    line-height:160px;
    text-shadow:
    0 0 20px rgba(0,150,255,0.8),
    0 0 40px rgba(0,100,255,0.4);

    animation:moveWM 20s linear infinite;
}

@keyframes moveWM{
    0%{
        transform:translate(0,0) rotate(-25deg);
    }
    100%{
        transform:translate(150px,150px) rotate(-25deg);
    }
}

/* Header */

.header-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.header-icon {
    width: 55px;   /* صغر الحجم هنا */

}

h1{

    font-size:42px;
    margin:0;
}

h2,h3{
    position:relative;
    z-index:10;

}

/* Buttons */

.btn{
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
    position:relative;
    z-index:10;
}

.btn-surprise{

    font-size:18px;
    margin:10px;
    box-shadow:0 0 15px rgba(0,255,204,.4);
}

.btn-surprise:hover{
    transform:scale(1.1);
}

.dl-all{
    padding:15px 30px;
    background:linear-gradient(45deg,#ff8c00,#ff0055);
    color:white;
    font-size:18px;
    margin:15px;
}

.dl-all:hover{
    transform:scale(1.08);
}

/* Grid */

.container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:20px;
    padding:20px;
    position:relative;
    z-index:10;
}

.card{
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:10px;
    backdrop-filter:blur(5px);
    box-shadow:0 0 15px rgba(0,0,0,.5);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px #00aaff;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:12px;

/* Download Button */

    color:white;
    box-shadow:0 0 10px rgba(0,123,255,.5);

/* Telegram */

/* Gallery */

const gallery = document.getElementById("gallery");

async function downloadImg(url,filename){

    try{

        const res = await fetch(url);
        const blob = await res.blob();

        const a = document.createElement("a");

        a.href = URL.createObjectURL(blob);
        a.download = filename;

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

    }catch(err){

        window.open(url,"_blank");

    }
}

/* Create Cards */

imageUrls.forEach((url,index)=>{

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
    
    <img src="${url}" loading="lazy">

    <button class="btn dl-single"
    onclick="downloadImg('${url}','Astros-Wall-${index+1}.jpg')">
    تنزيل 📥
    </button>

    `;

    gallery.appendChild(card);

});

/* Download All */

        setTimeout(()=>{

            downloadImg(
            url,
            `Astros-Wall-${index+1}.jpg`

};

    img.style.maxWidth="92%";
    img.style.maxHeight="80%";
    img.style.borderRadius="20px";
    img.style.boxShadow="0 0 40px #00aaff";

    const closeBtn = document.createElement("button");

    closeBtn.style.padding="14px 30px";

    closeBtn.onclick=()=>{

    };

    overlay.appendChild(img);
    overlay.appendChild(closeBtn);

    document.body.appendChild(overlay);
