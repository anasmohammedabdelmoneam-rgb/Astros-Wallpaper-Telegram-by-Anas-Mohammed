<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Astros Wallpapers</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a75ff">
<link rel="apple-touch-icon" href="icon-192.png">

<style>

body{
    margin:0;
    background:linear-gradient(to bottom,#000000 0%,#1a75ff 60%,#000000 100%);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    color:white;
    text-align:center;
    min-height:100vh;
    overflow-x:hidden;
}

/* Watermark */

.watermark-container{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.watermark-text{
    position:absolute;
    width:300%;
    height:300%;
    top:-50%;
    left:-50%;
    font-size:85px;
    font-weight:900;
    color:rgba(255,255,255,0.13);
    transform:rotate(-25deg);
    white-space:pre;
    line-height:160px;
    text-shadow:
    0 0 20px rgba(0,150,255,0.8),
    0 0 40px rgba(0,100,255,0.4);

    animation:moveWM 20s linear infinite;
}

@keyframes moveWM{
    0%{
        transform:translate(0,0) rotate(-25deg);
    }
    100%{
        transform:translate(150px,150px) rotate(-25deg);
    }
}

/* Header */

.header-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:25px;
    position:relative;
    z-index:10;
}

.header-icon{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 20px #00aaff;
}

h1{
    color:#66ccff;
    text-shadow:0 0 15px #0099ff;
    font-size:42px;
    margin:0;
}

h2,h3{
    position:relative;
    z-index:10;
    color:white;
}

/* Buttons */

.btn{
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
    position:relative;
    z-index:10;
}

.btn-surprise{
    padding:15px 30px;
    background:linear-gradient(45deg,#00ffcc,#00aaff);
    color:#000;
    font-size:18px;
    margin:10px;
    box-shadow:0 0 15px rgba(0,255,204,.4);
}

.btn-surprise:hover{
    transform:scale(1.1);
}

.dl-all{
    padding:15px 30px;
    background:linear-gradient(45deg,#ff8c00,#ff0055);
    color:white;
    font-size:18px;
    margin:15px;
}

.dl-all:hover{
    transform:scale(1.08);
}

/* Grid */

.container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:20px;
    padding:20px;
    position:relative;
    z-index:10;
}

.card{
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:10px;
    backdrop-filter:blur(5px);
    box-shadow:0 0 15px rgba(0,0,0,.5);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px #00aaff;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:12px;
}

/* Download Button */

.dl-single{
    width:100%;
    margin-top:10px;
    padding:10px;
    background:#007bff;
    color:white;
    box-shadow:0 0 10px rgba(0,123,255,.5);
}

.dl-single:hover{
    background:#00ffcc;
    color:black;
}

/* Telegram */

.main-link{
    display:block;
    width:fit-content;
    margin:50px auto;
    padding:18px 35px;
    border-radius:50px;
    background:linear-gradient(45deg,#0088cc,#00aaff);
    color:white;
    text-decoration:none;
    font-size:28px;
    font-weight:900;
    border:3px solid white;
    box-shadow:0 0 25px rgba(0,170,255,.8);
    transition:.4s;
    position:relative;
    z-index:10;
}

.main-link:hover{
    transform:scale(1.12);
    background:white;
    color:#0088cc;
}

</style>
</head>

<body>

<div class="watermark-container">
<div class="watermark-text">
Astros Wallpaper Astros Wallpaper Astros Wallpaper
Astros Wallpaper Astros Wallpaper Astros Wallpaper
Astros Wallpaper Astros Wallpaper Astros Wallpaper
Astros Wallpaper Astros Wallpaper Astros Wallpaper
</div>
</div>

<div class="header-box">
<img src="icon-512.png" class="header-icon">
<h1>Astros Wallpapers</h1>
</div>

<h2>أفضل تطبيق خلفيات 🔥</h2>
<h3>رابط القناة في آخر الصفحة</h3>

<button id="surpriseBtn" class="btn btn-surprise">
🎲 فاجئني بخلفية
</button>

<button class="btn dl-all" id="downloadAll">
📥 تحميل جميع الصور
</button>

<div class="container" id="gallery"></div>

<a href="https://t.me/aannddff654" class="main-link">
انضم لقناتنا على تيليجرام 🔗
</a>

<script>

/* الصور */

const imageUrls = [

"https://i.postimg.cc/4x2wMGxg/1-(1).jpg",
"https://i.postimg.cc/TwkQgX5Q/1-(2).jpg",
"https://i.postimg.cc/PJpbDvkM/1-(3).jpg",
"https://i.postimg.cc/k4ZK7MtW/1-(4).jpg",
"https://i.postimg.cc/FKTjtwmR/1-(5).jpg",
"https://i.postimg.cc/BZL2yhzM/1-(6).jpg",
"https://i.postimg.cc/XvYCgxFj/1-(7).jpg",
"https://i.postimg.cc/ZR3KPyf0/1-(8).jpg",
"https://i.postimg.cc/fRLz2PHF/1-(9).jpg",
"https://i.postimg.cc/JnbMHCnG/1-(10).jpg",
"https://i.postimg.cc/bwsPHtrd/1-(11).jpg",
"https://i.postimg.cc/j5QYd6gN/1-(12).jpg",
"https://i.postimg.cc/XvdTQcbr/1-(13).jpg",
"https://i.postimg.cc/SRT5JgWC/1-(14).jpg",
"https://i.postimg.cc/x1b71yqy/1-(15).jpg",
"https://i.postimg.cc/xC7pQXY3/1-(16).jpg",
"https://i.postimg.cc/fTYq4WPC/1-(17).jpg",
"https://i.postimg.cc/9M41LcTp/1-(18).jpg",
"https://i.postimg.cc/fT7C2231/1-(19).jpg",
"https://i.postimg.cc/mgXQJ0T8/1-(20).jpg"

/* أكمل باقي الصور هنا */

];

/* Gallery */

const gallery = document.getElementById("gallery");

async function downloadImg(url,filename){

    try{

        const res = await fetch(url);
        const blob = await res.blob();

        const a = document.createElement("a");

        a.href = URL.createObjectURL(blob);
        a.download = filename;

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

    }catch(err){

        window.open(url,"_blank");

    }
}

/* Create Cards */

imageUrls.forEach((url,index)=>{

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
    
    <img src="${url}" loading="lazy">

    <button class="btn dl-single"
    onclick="downloadImg('${url}','Astros-Wall-${index+1}.jpg')">
    تنزيل 📥
    </button>

    `;

    gallery.appendChild(card);

});

/* Download All */

document.getElementById("downloadAll").onclick = ()=>{

    imageUrls.forEach((url,index)=>{

        setTimeout(()=>{

            downloadImg(
            url,
            `Astros-Wall-${index+1}.jpg`
            );

        },index*250);

    });

};

/* Surprise */

document.getElementById("surpriseBtn").onclick = ()=>{

    const randomUrl =
    imageUrls[Math.floor(Math.random()*imageUrls.length)];

    const overlay = document.createElement("div");

    overlay.style.position="fixed";
    overlay.style.inset="0";
    overlay.style.background="rgba(0,0,0,.95)";
    overlay.style.display="flex";
    overlay.style.flexDirection="column";
    overlay.style.justifyContent="center";
    overlay.style.alignItems="center";
    overlay.style.zIndex="99999";

    const img = document.createElement("img");

    img.src = randomUrl;

    img.style.maxWidth="92%";
    img.style.maxHeight="80%";
    img.style.borderRadius="20px";
    img.style.boxShadow="0 0 40px #00aaff";

    const closeBtn = document.createElement("button");

    closeBtn.innerText="✖ إغلاق";

    closeBtn.className="btn";

    closeBtn.style.marginTop="20px";
    closeBtn.style.padding="14px 30px";
    closeBtn.style.background="#ff0033";
    closeBtn.style.color="white";

    closeBtn.onclick=()=>{
        overlay.remove();
    };

    overlay.appendChild(img);
    overlay.appendChild(closeBtn);

    document.body.appendChild(overlay);

};

/* PWA */

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("./service-worker.js");

}

</script>

</body>
</html>
