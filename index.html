*{
margin:0;
padding:0;
box-sizing:border-box;

body{

font-family:Segoe UI,sans-serif;

background:
linear-gradient(
180deg,
#000 0%,
#1768ff 60%,
#000 100%
);

color:#fff;

text-align:center;

min-height:100vh;

overflow-x:hidden;

}

.watermark-container{

position:fixed;

inset:0;

pointer-events:none;

overflow:hidden;

z-index:0;

}

.watermark-text{

position:absolute;

width:300%;

height:300%;

top:-50%;

left:-50%;

font-size:90px;

font-weight:900;

line-height:170px;

white-space:pre;

color:rgba(255,255,255,.12);

transform:rotate(-25deg);

animation:move 18s linear infinite;

}

@keyframes move{

from{

transform:
translate(0,0)
rotate(-25deg);

}

to{

transform:
translate(150px,150px)
rotate(-25deg);

}

}

.header-box{

display:flex;

justify-content:center;

align-items:center;

gap:12px;

margin-top:25px;

position:relative;

z-index:10;

}

.header-icon{

width:70px;

height:70px;

border-radius:18px;

box-shadow:0 0 18px #00aaff;

}

h1{

font-size:46px;

color:#7cc7ff;

text-shadow:0 0 18px #00aaff;

}

h2,h3{

margin-top:15px;

color:#80cfff;

position:relative;

z-index:10;

}

.container{

position:relative;

z-index:10;

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(170px,1fr));

gap:20px;

padding:25px;

}

.card{

background:rgba(255,255,255,.1);

border-radius:18px;

padding:10px;

backdrop-filter:blur(8px);

transition:.3s;

}

.card:hover{

transform:translateY(-6px);

box-shadow:0 0 20px #00aaff;

}

.card img{

width:100%;

height:240px;

border-radius:12px;

object-fit:cover;

cursor:pointer;

}

.btn{

width:100%;

margin-top:10px;

padding:12px;

border:none;

border-radius:12px;

font-weight:bold;

cursor:pointer;

}

.preview{

background:#00d2ff;

color:#000;

}

.download{

background:#0066ff;

color:#fff;

}

/* ===== iPhone Mockup ===== */

.mockup{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.93);

justify-content:center;

align-items:center;

flex-direction:column;

z-index:999999;

}

.phone{
    position:relative;
    width:360px;
    aspect-ratio:1024/1536;
}

.screen{

    top:42px;

    height:450px;

    overflow:hidden;

    border-radius:36px;

}

.wallpaper{

    height:100%;
    object-fit:cover;
    display:block;
}

.frame{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}
.mockup-buttons{

display:flex;

gap:15px;

margin-top:25px;

}

.mockup-buttons button{

padding:14px 28px;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

.closeBtn{

background:#ff2d55;

color:#fff;

.downloadBtn{

background:#00d084;

color:#000;

const gallery = document.getElementById("gallery");

const mockup = document.getElementById("mockup");
const wallpaper = document.getElementById("wallpaper");

const closeBtn = document.getElementById("close");
const downloadBtn = document.getElementById("download");

let currentWallpaper = "";

async function downloadImg(url, filename){

    try{

        const res = await fetch(url);

        const blob = await res.blob();

        const a = document.createElement("a");

        a.href = URL.createObjectURL(blob);

        a.download = filename;

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

    }catch(e){

        window.open(url,"_blank");

    }

}

function openMockup(url){

    currentWallpaper = url;

    wallpaper.src = url;

    mockup.style.display = "flex";

}

closeBtn.onclick = ()=>{

    mockup.style.display = "none";

};

downloadBtn.onclick = ()=>{

    downloadImg(currentWallpaper,"Astros-Wallpaper.jpg");

};

mockup.onclick=(e)=>{

    if(e.target===mockup){

        mockup.style.display="none";

    }

};

imageUrls.forEach((url,index)=>{

    const card=document.createElement("div");

    card.className="card";

    card.innerHTML=`

    <img src="${url}" onclick="openMockup('${url}')">

    <button class="btn preview"
    onclick="openMockup('${url}')">

    📱 معاينة

    </button>

    <button class="btn download"
    onclick="downloadImg('${url}','Astros-${index+1}.jpg')">

    📥 تنزيل

    </button>

    `;

    gallery.appendChild(card);

});

document.getElementById("surpriseBtn").onclick=()=>{

    const random=imageUrls[
        Math.floor(Math.random()*imageUrls.length)
    ];

    openMockup(random);

};
